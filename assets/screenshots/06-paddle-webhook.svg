  <text x="132" y="466" fill="#f8fbff" font-family="Consolas,monospace" font-size="24">✓ transaction.payment_failed</text>
  <text x="132" y="510" fill="#f8fbff" font-family="Consolas,monospace" font-size="24">✓ transaction.canceled</text>
  <text x="132" y="554" fill="#f8fbff" font-family="Consolas,monospace" font-size="24">✓ transaction.past_due</text>
  <text x="96" y="626" fill="#ff315d" font-family="Inter,Arial" font-size="20" font-weight="700">Only transaction.completed should unlock the report.</text>
