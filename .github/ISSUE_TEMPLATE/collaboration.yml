name: Public Correction or Docs Addition
description: Report a public documentation issue, add deployment notes, or discuss a PR.
title: "[Docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Please keep this issue public-safe. Do not post private contact details, API keys, payment account details, user data, or screenshots with secrets. For private collaboration or case exchange, use the collaboration form entry on the site.
  - type: textarea
    id: goal
    attributes:
      label: What should be corrected or added?
      description: Describe the documentation issue, missing step, broken link, or public-safe improvement.
      placeholder: "Example: The Paddle webhook step needs one more screenshot..."
    validations:
      required: true
  - type: textarea
    id: current-state
    attributes:
      label: Current state
      description: If relevant, mention the tutorial chapter, platform, or public demo URL.
      placeholder: "Chapter name, public URL, platform version, screenshot without secrets..."
    validations:
      required: false
  - type: dropdown
    id: topic
    attributes:
      label: Main topic
      options:
        - Codex build workflow
        - Payment and unlock flow
        - Zeabur deployment
        - Paddle setup
        - Translation or documentation
        - Screenshot or visual guide
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What kind of response would help?
      placeholder: "Documentation correction, PR review, missing screenshot, extra checklist item..."
    validations:
      required: true
